# /etc/nginx/sites-available/<your-domain>  (then: ln -s into sites-enabled, nginx -t, reload,
# and `certbot --nginx -d <your-domain> --redirect` for HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name example.duckdns.org;   # <- your domain
    root /var/www/projectdays;         # <- where you copy site/
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
    location /img/ {
        expires 7d;
    }
}
